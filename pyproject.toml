[project]
name = "expirytrack"
version = "1.1.0"
description = "ExpiryTrack Web Interface - Flask Application for tracking options expiry data"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.13.0",
    "cryptography>=48.0.0",
    "duckdb>=1.5.2",
    "flask>=3.1.3",
    "flask-session>=0.8.0",
    "flask-sqlalchemy>=3.1.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "numpy>=2.2.6,<2.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3,<3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.67.3",
]

[project.scripts]
expirytrack = "app:app"
